<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>エラー</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .error-box { background: #f8d7da; border: 1px solid #f5c6cb; padding: 20px; border-radius: 5px; }
        h1 { color: #721c24; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>⚠️ エラーが発生しました</h1>
        <p>{{ error }}</p>
        <a href="/">トップに戻る</a>
    </div>
</body>
</html>
